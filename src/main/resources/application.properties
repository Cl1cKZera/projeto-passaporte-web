# Configurações do Banco de Dados H2 (Salva em arquivo local na pasta do projeto)
spring.datasource.url=jdbc:h2:file:./bd/meuBanco
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driverClassName=org.h2.Driver

# Habilita o painel visual do H2 no navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configurações do Hibernate (JPA)
# update: Cria/atualiza as tabelas automaticamente baseadas nas classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Exibe o SQL gerado no console (ótimo pra aprender e debugar!)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true